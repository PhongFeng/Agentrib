# Include only in the separate HTTPS origin for browser play.
location /play/ {
    access_log off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 3;
    gzip_types application/wasm application/octet-stream text/javascript;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8765;
}
