location = /console {
    return 301 /console/;
}

location /console/ {
    try_files $uri $uri/ =404;
}

location /api/v1/ {
    client_max_body_size 96m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8765;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8765;
}
